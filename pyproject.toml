[project]
name = "daily3albums"
version = "0.1.0"
description = "Triangulum Daily: nine daily album recommendations across three release windows"
requires-python = ">=3.11"

dependencies = [
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
]

[project.scripts]
daily3albums = "daily3albums.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["daily3albums*"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
