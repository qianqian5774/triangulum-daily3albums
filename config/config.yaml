# Public schema versions are owned by writer/validator/parser code, not YAML.

# -----------------------------------------------------------------------------
# 产品行为说明
# -----------------------------------------------------------------------------
# 产品时钟与 release SLA 固定为 Asia/Shanghai，authority 位于 Python/UI
# 时间实现和 GitHub workflow，不由本文件切换。

# -----------------------------------------------------------------------------
# 历史与去重策略 (优化版)
# -----------------------------------------------------------------------------
history:
  # 静态 Archive 保留最近 N 个有数据的日期；不是自然日连续窗口。
  archive_retention_days: 7
  # 专辑去重：同一 MusicBrainz release group 正常情况下 7 天内不重复。
  dedupe_same_rg_days: 7
  # 艺人去重：同一个艺人正常情况下 7 天内不重复。
  # 注意：如果设得太长(如30天)，在垂直风格(如IDM)中会极快耗尽候选池
  dedupe_same_artist_days: 7

# -----------------------------------------------------------------------------
# 数据清洗与匹配器
# -----------------------------------------------------------------------------
normalizer:
  # Shadow reference only：用于观测假设影响，不执行候选拒绝或 eligible filtering。
  min_confidence: 0.72
  # Shadow reference only：用于观测 best/runner-up gap，不执行歧义拒绝。
  ambiguity_gap: 0.08
  # Reserved for TD-02B；当前没有生产 consumer，不执行 quarantine/drop。
  hard_ambiguity_policy: "quarantine"
  # 以下三项是当前 MusicBrainz 归一化预算的生产 authority。
  mb_max_queries_per_candidate: 3
  mb_max_candidates_per_slot: 100
  mb_time_budget_s_per_slot: 60

# -----------------------------------------------------------------------------
# 类型允许开关 (CLI直接读取)
# -----------------------------------------------------------------------------
allow_types:
  album: true
  compilation: false
  live: false
  ep: true
  single: false

